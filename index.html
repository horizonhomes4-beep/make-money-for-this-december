  <div class=step><i>4</i><div><b>Watch it grow live</b><br><span class=m>Clicks, subscribers and earnings update in your dashboard.</span></div></div>
  <div class=step><i>5</i><div><b>Invite friends</b><br><span class=m>Earn ${N(S.override)} on every sale they make.</span></div></div>
  <div class=step><i>6</i><div><b>Withdraw at ${N(S.minWithdraw)}</b><br><span class=m>Cash out to your bank, or keep marketing and let it grow.</span></div></div></div>

  <div class=card><h3>🔒 Real &amp; transparent</h3><div class=trust>
  <div>📊 Every click and subscriber is tracked</div><div>⚡ Earnings credited when payment is confirmed</div>
  <div>🏦 Paid to any Nigerian bank</div><div>👀 You see everything in your dashboard</div></div></div>

  <p class="m" style="text-align:center;margin-top:24px">© Math Cloud Tech Services</p>`;calc();
}
const mh=(m,p)=>m.type==='bank'?`<div class=card><b>🏦 ${esc(m.label)}</b><div class=m>${esc(m.details)}</div></div>`:`<div class=card><b>💳 ${m.type==='paystack'?'Paystack':'Flutterwave'} – ${esc(m.label)}</b><br><br><a class="btn y" target=_blank rel=noopener href="${esc(m.link)}">Pay ${N(p.price)} now</a></div>`;
function buy(id){const p=PROD[id],ms=vals(PAY).filter(m=>m.active!==false);
  if(!ms.length)return toast('No payment method available yet');
  openM(`<h3>${esc(p.name)} – ${N(p.price)}</h3>
  ${REFOK?`<div class=lock style="background:#d1fae5;color:#064e3b">🤝 Referral code <b>${esc(REF)}</b> applied</div>`:''}
  ${url(p.demo)?`<a class="btn o sm" target=_blank rel=noopener href="${url(p.demo)}">🎬 Watch demo first</a><br><br>`:''}
  <form onsubmit="order(event,'${id}')"><b>Step 1: Your details</b>
  <input name=name placeholder="Your full name" required minlength=2>
  <input name=email type=email placeholder="Email">
  <input name=phone type=tel placeholder="Phone / WhatsApp" required minlength=7>
  <select name=method>${ms.map(m=>`<option value="${esc(m.label)}">${esc(m.label)}</option>`).join('')}</select>
  <button class=full>Continue to payment →</button></form>`);}
async function order(e,id){e.preventDefault();const f=e.target,p=PROD[id],ms=vals(PAY).filter(m=>m.active!==false);f.querySelector('button').disabled=true;
  try{let aff='';if(REF){aff=(await db.ref('affiliateCodes/'+REF).once('value')).val()||''}
  const k=db.ref('orders').push().key;
  await db.ref('orders/'+k).set({productId:id,productName:p.name,price:p.price,buyerName:f.name.value.trim(),buyerEmail:f.email.value.trim(),buyerPhone:f.phone.value.trim(),method:f.method.value,payRef:'',ref:REF||'',affiliateUid:aff,status:'pending',createdAt:TS});
  const ch=ms.find(m=>m.label===f.method.value)||ms[0],rest=ms.filter(m=>m!==ch);
  openM(`<h3>Step 2: Pay ${N(p.price)}</h3><div class=lock>Your order code: <b style="font-size:20px">${k.slice(-6).toUpperCase()}</b><br>Use it as your payment reference / narration.</div>
  ${mh(ch,p)}${rest.length?`<details><summary class=m>Other ways to pay</summary><br>${rest.map(m=>mh(m,p)).join('')}</details>`:''}
  <p class=m>After you pay, we confirm your payment and activate your subscription. Keep your order code.</p><button class=full onclick=closeM()>Done</button>`)}
  catch(x){toast('Could not submit: '+x.message);f.querySelector('button').disabled=false}}

/* ---------- AUTH ---------- */
function authV(mode){const s=mode==='signup';
  openM(`<h3>${s?'Join as a Marketer':'Login'}</h3><form onsubmit="${s?'signup':'login'}(event)">
  ${s?'<input name=name placeholder="Full name" required minlength=2><input name=phone type=tel placeholder="Phone / WhatsApp">':''}
  <input name=email type=email placeholder="Email" required>
  <input name=pw type=password placeholder="Password (min 6)" minlength=6 required>
  <button class=full>${s?'Create Account':'Login'}</button></form>
  <p class=m style="text-align:center" onclick="authV('${s?'login':'signup'}')"><u>${s?'Have an account? Login':'New here? Join free'}</u></p>`)}
async function login(e){e.preventDefault();const f=e.target;try{await auth.signInWithEmailAndPassword(f.email.value,f.pw.value);closeM()}catch(x){toast('Login failed: check email/password')}}
async function signup(e){e.preventDefault();const f=e.target;f.querySelector('button').disabled=true;
  try{let parent='';const pc=JOIN||REF;if(pc)parent=(await db.ref('affiliateCodes/'+pc).once('value')).val()||'';
  const c=await auth.createUserWithEmailAndPassword(f.email.value.trim(),f.pw.value),uid=c.user.uid;
  let code=null;
  for(let i=0;i<8&&!code;i++){const k=(f.name.value.replace(/[^a-z]/gi,'').slice(0,4)+Math.random().toString(36).slice(2,6)).toUpperCase();try{await db.ref('affiliateCodes/'+k).set(uid);code=k}catch(x){}}
  await db.ref('users/'+uid).set({name:f.name.value.trim(),email:f.email.value.trim(),phone:f.phone.value.trim(),refCode:code,referredBy:parent,createdAt:TS});
  if(parent)await db.ref(`referrals/${parent}/${uid}`).set({name:f.name.value.trim(),at:TS});
  closeM();toast('Welcome! 🎉')}
  catch(x){toast(x.message);f.querySelector('button').disabled=false}}

/* ---------- AFFILIATE ---------- */
function aff(){cur='aff';clr();$('#nav').innerHTML=`<button class="sm o" onclick="out()">Logout</button>`;
  on(db.ref('users/'+me.uid),'u',()=>{if(D.u.refCode&&!D.cl)on(db.ref('clicks/'+D.u.refCode),'cl',affR);affR()});
  PE=null;on(db.ref('earnings/'+me.uid),'e',()=>{const k=Object.keys(D.e||{});if(PE!==null&&k.length>PE){const l=vals(D.e).sort((x,y)=>(y.at||0)-(x.at||0))[0];toast('🎉 +'+N(l.amount)+' earned! Payment confirmed')}PE=k.length;affR()});on(db.ref('payouts/'+me.uid),'p',affR);
  on(db.ref('referrals/'+me.uid),'t',affR);on(db.ref('shares/'+me.uid),'sh',affR);gate();
  on(db.ref('orders').orderByChild('affiliateUid').equalTo(me.uid),'o',affR);
  on(db.ref('withdrawals').orderByChild('uid').equalTo(me.uid),'w',affR);}
const avail=()=>sum(D.e)+bonus(D.sh,D.e)-sum(D.p)-vals(D.w).filter(w=>w.status==='pending').reduce((a,w)=>a+w.amount,0);
function affR(){if(cur!=='aff'||!D.u)return;const u=D.u;if(!u.refCode)return $('#app').innerHTML='<p class=m>Setting up your account…</p>';
  const shd=D.sh||{},dsn=Math.floor((Date.now()+SOFF)/864e5)*864e5,left=Math.max(0,S.shareCap-(shd.dayStart===dsn?shd.dayCount:0)),a=avail(),link=`${BASE}?ref=${u.refCode}`,inv=`${BASE}?join=${u.refCode}`,
  msg=t=>encodeURIComponent(t),
  sh=(url,t)=>`<a class="btn sm" target=_blank rel=noopener href="https://wa.me/?text=${msg(t+' '+url)}">WhatsApp</a><a class="btn sm" style="background:#1877f2" target=_blank rel=noopener href="https://www.facebook.com/sharer/sharer.php?u=${msg(url)}">Facebook</a><a class="btn sm" style="background:#229ed9" target=_blank rel=noopener href="https://t.me/share/url?url=${msg(url)}&text=${msg(t)}">Telegram</a><a class="btn sm" style="background:#111" target=_blank rel=noopener href="https://twitter.com/intent/tweet?text=${msg(t)}&url=${msg(url)}">X</a>`;
  const ords=vals(D.o).sort((x,y)=>y.createdAt-x.createdAt),team=vals(D.t),ear=vals(D.e).sort((x,y)=>y.at-x.at);
  $('#app').innerHTML=`<p class=m>Hi <b>${esc(u.name)}</b> 👋</p>
  <div class=big><small>Available balance</small><b>${N(a)}</b>
  ${a>=S.minWithdraw?`<button class="y full" onclick="wd()">Withdraw ${N(a)}</button>`:`<div style="background:#fff3;border-radius:99px;height:10px;margin-top:8px"><div style="background:var(--y);height:10px;border-radius:99px;width:${Math.min(100,a/S.minWithdraw*100)}%"></div></div><small>${N(S.minWithdraw-a)} more to reach the ${N(S.minWithdraw)} minimum withdrawal</small>`}</div>
  <div class=grid><div class=stat><small>Total earned</small><b>${N(sum(D.e)+bonus(D.sh,D.e))}</b></div><div class=stat><small>Paid out</small><b>${N(sum(D.p))}</b></div>
  <div class=stat><small>Link clicks</small><b>${D.cl&&typeof D.cl==='number'?D.cl:0}</b></div><div class=stat><small>Subscribers</small><b>${ords.filter(o=>o.status==='approved').length}</b></div></div>
  <div class=card style="margin-top:12px"><h3>📣 Share &amp; earn ${N(S.shareReward)} per share</h3>
  <div class=m>Share your one link below, it shows every product. Each share earns <b>${N(S.shareReward)}</b> (up to ${S.shareCap} a day). You have <b>${left} share${left==1?'':'s'}</b> left today. Total share bonus: <b>${N((shd.total||0)*S.shareReward)}</b></div>
  ${unl(D.e)?'':`<div class=lock>🔒 Your share bonus unlocks with your first confirmed sale. Keep sharing, it is already counting!</div>`}
  <div class=row style="display:block"><b>🔗 Your link: all products &amp; services</b> <small>one link for everything • ${N(S.direct)} per subscriber • ${N(S.override)} on your team's sales (${team.length} joined)</small>
  <div class=link>${link}</div>
  <div class=share style="margin-top:8px"><button class="sm y" onclick="copy('${link}')">Copy link</button><button class=sm onclick="copy(allMsg()+'\n'+'${link}');toast('Caption + link copied ✓')">Copy caption + link</button><button class=sm onclick="shr('wa')">WhatsApp</button><button class=sm style="background:#1877f2;box-shadow:0 4px 0 #0f4fa8" onclick="shr('fb')">Facebook</button><button class=sm style="background:#229ed9;box-shadow:0 4px 0 #1673a0" onclick="shr('tg')">Telegram</button><button class=sm style="background:#111;box-shadow:0 4px 0 #000" onclick="shr('x')">X</button></div></div></div>
  <div class=card><h3>💡 How you earn</h3><div class=m>• Someone subscribes through <b>your link</b> → you earn <b>${N(S.direct)}</b>.<br>• Someone joins as a marketer through <b>the same link</b> and makes a sale → you earn <b>${N(S.override)}</b> on each.<br>• Every product share earns a small bonus too (${N(S.shareReward)}), unlocked by your first sale.<br>• Earnings appear after payment is confirmed. Withdraw from <b>${N(S.minWithdraw)}</b>.</div></div>
  <div class=card><h3>🏦 Bank details</h3>${u.bank?`<div class=m>${esc(u.bank.bankName)} • ${esc(u.bank.accNo)}<br>${esc(u.bank.accName)}</div>`:''}
  <form onsubmit="bank(event)"><input name=bn placeholder="Bank name (e.g. GTBank)" value="${esc(u.bank?.bankName)}" required><input name=an placeholder="Account number (10 digits)" inputmode=numeric pattern="[0-9]{10}" value="${esc(u.bank?.accNo)}" required><input name=nm placeholder="Account name" value="${esc(u.bank?.accName)}" required><button class=full>Save bank details</button></form></div>
  <div class=card><h3>🧾 My subscribers</h3>${ords.map(o=>`<div class=row><div><b>${esc(o.buyerName)}</b><small>${esc(o.productName)} • ${dt(o.createdAt)} • #${o.id.slice(-6).toUpperCase()}</small></div><span class="tag ${o.status}">${o.status}</span></div>`).join('')||'<p class=m>No subscribers yet. Share your link!</p>'}</div>
  <div class=card><h3>👥 My team</h3>${team.map(t=>`<div class=row><div><b>${esc(t.name)}</b><small>Joined ${dt(t.at)}</small></div></div>`).join('')||'<p class=m>Nobody invited yet.</p>'}</div>
  <div class=card><h3>💵 Earnings history</h3>${ear.map(x=>`<div class=row><div><b>+${N(x.amount)}</b><small>${x.type==='direct'?'Your subscriber':'Team sale: '+esc(x.from)} • ${dt(x.at)}</small></div></div>`).join('')||'<p class=m>Earnings show here.</p>'}</div>
  <div class=card><h3>🏧 Withdrawals</h3>${vals(D.w).sort((x,y)=>y.createdAt-x.createdAt).map(w=>`<div class=row><div><b>${N(w.amount)}</b><small>${dt(w.createdAt)}</small></div><span class="tag ${w.status}">${w.status}</span></div>`).join('')||'<p class=m>None yet.</p>'}</div>`;}
async function bank(e){e.preventDefault();const f=e.target;try{await db.ref(`users/${me.uid}/bank`).set({bankName:f.bn.value.trim(),accNo:f.an.value.trim(),accName:f.nm.value.trim()});toast('Saved ✓')}catch(x){toast('Check account number (10 digits)')}}
async function wd(){const a=avail();if(!D.u.bank)return toast('Add bank details first');if(a<S.minWithdraw)return;
  try{await db.ref('withdrawals').push({uid:me.uid,amount:a,status:'pending',createdAt:TS});toast('Withdrawal requested ✓')}catch(x){toast(x.message)}}

</script></body></html>
